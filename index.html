<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸡舍控制器</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.6rem;
      color: #1a1a1a;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    button {
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.85; }
    .btn-open  { background: #22c55e; }
    .btn-close { background: #3b82f6; }
    .btn-stop  { background: #ef4444; }
    .log {
      height: 180px;
      overflow-y: auto;
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      font-family: monospace;
      line-height: 1.5;
      color: #334155;
    }
    .log div { margin-bottom: 4px; }
    .time { color: #94a3b8; margin-right: 6px; }
  </style>
</head>
<body>
  <h1>🐔 鸡舍控制器</h1>

  <div class="card">
    <label>设备 ID（例如 ESP_XXXXXXXX）</label>
    <input type="text" id="deviceId" placeholder="ESP_A1B2C3D4" value="">
    
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="connText">未连接</span>
    </div>
  </div>

  <div class="card">
    <div class="btn-group">
      <button class="btn-open"  onclick="sendCmd('OPEN')">开门</button>
      <button class="btn-close" onclick="sendCmd('CLOSE')">关门</button>
      <button class="btn-stop"  onclick="sendCmd('STOP')">停止</button>
    </div>
  </div>

  <div class="card">
    <label>运行日志</label>
    <div class="log" id="log"></div>
  </div>

  <script>
    // ========== 配置 ==========
    const brokerUrl = 'wss://b7fea2bf.ala.asia-southeast1.emqxsl.com:8084/mqtt';
    const mqttUser  = 'eps8266nn';
    const mqttPass  = 'yu155414';

    let client = null;
    let currentDeviceId = '';

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.innerHTML = `<div><span class="time">[${time}]</span>${msg}</div>` + el.innerHTML;
    }

    function updateStatus(connected) {
      const dot = document.getElementById('dot');
      const text = document.getElementById('connText');
      if (connected) {
        dot.className = 'dot connected';
        text.textContent = '已连接';
      } else {
        dot.className = 'dot disconnected';
        text.textContent = '未连接';
      }
    }

    function connectMQTT() {
      if (client) {
        client.end(true);
      }

      currentDeviceId = document.getElementById('deviceId').value.trim().toUpperCase();
      if (!currentDeviceId) {
        log('请先填写设备 ID');
        return;
      }

      log('正在连接 MQTT...');
      client = mqtt.connect(brokerUrl, {
        username: mqttUser,
        password: mqttPass,
        clientId: 'web_' + Math.random().toString(16).substr(2, 8),
        clean: true,
        reconnectPeriod: 5000
      });

      client.on('connect', () => {
        updateStatus(true);
        log('MQTT 连接成功');
        // 订阅状态主题
        const statusTopic = `home/esp8266/status/${currentDeviceId}`;
        client.subscribe(statusTopic, (err) => {
          if (!err) log(`已订阅: ${statusTopic}`);
        });
      });

      client.on('message', (topic, message) => {
        log(`状态 ← ${message.toString()}`);
      });

      client.on('close', () => {
        updateStatus(false);
        log('连接断开');
      });

      client.on('error', (err) => {
        log('错误: ' + err.message);
      });
    }

    function sendCmd(cmd) {
      if (!client || !client.connected) {
        log('请先连接 MQTT（填写设备ID后会自动连接）');
        connectMQTT();
        return;
      }
      const topic = `home/esp8266/cmd/${currentDeviceId}`;
      client.publish(topic, cmd);
      log(`发送 → ${cmd}`);
    }

    // 设备ID输入后自动连接
    document.getElementById('deviceId').addEventListener('change', connectMQTT);
    document.getElementById('deviceId').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') connectMQTT();
    });
  </script>
</body>
</html>
